<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смешные картинки</title>
    <style>
      .p1 {
        color: #3e2723;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        text-align: center;
        font-size: 40px;
        font-weight: 400;
        margin: 0;

      }
      .p2 {
	      color: #3e2723;
	      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: 20px;
        text-align: center;

      }
      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-top: 30px;

      }

      .gallery img {
        width: 250px;
        height: 250px;
        object-fit: cover;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      
      }
      ul {
        max-width: 600px;
        margin: 20px auto;
        font-size: 18px;
        line-height: 1.5;
      }
    </style>
</head>
<body style="background-color: #f4c9d6; padding: 50px">
  <p class="p1">Смешные картинки </p>
  <p class="p2">(возможно)</p>
  <ul>
    <li>Здесь</li>
    <li>могли бы быть причины</li>
    <li>почему это смешно</li>
  </ul>
  <div class="gallery">
    <img src="https://i.pinimg.com/736x/11/29/8c/11298c194b673256cab91ffaaa10670f.jpg" alt="Смешная картинка 1">
    <img src="https://i.pinimg.com/736x/3c/a6/c7/3ca6c7c5d8244caf4b76504443fdf1c8.jpg" alt="Смешная картинка 2">
    <img src="https://i.pinimg.com/736x/8d/eb/13/8deb13ef7eaada7b44ee43f43d1b9349.jpg" alt="Смешная картинка 3">
    <img src="https://i.pinimg.com/736x/14/c2/15/14c215a41c5c9bc0fca553d9148f419d.jpg" alt="Смешная картинка 4">
  </div>
</body>
</html>
